# ===============================
# NOM DE L'APPLICATION
# ===============================
spring.application.name=recouvrement_prjt


# ===============================
# CONFIGURATION BASE DE DONNÉES H2 (PERSISTANTE)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/recouvrementdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ===============================
# CONFIGURATION JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 🔥 IMPORTANT : garde les données après redémarrage
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# CONSOLE H2
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true


# ===============================
# SPRING SECURITY (compte test)
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin


# ===============================
# PORT DU SERVEUR
# ===============================
server.port=8080

# Upload Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB